name: Feature request
description: Suggest an improvement to Reloaded Explorer.
title: 'Feature: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: This is a public issue tracker. Do not include private files or credentials.
  - type: textarea
    id: problem
    attributes:
      label: What would you like to improve?
      description: Explain your use case and the change you suggest.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Optional context
